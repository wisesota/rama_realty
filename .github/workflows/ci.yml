name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RATE_LIMIT_SECRET: ci-rate-limit-secret-00000000000000000000000000000000
      BUYER_SESSION_SECRET: ci-buyer-session-secret-0000000000000000000000000000000
      NEXT_PUBLIC_SUPABASE_URL: https://ci-project.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
      RAMA_DEMO_MODE: "false"
      GEMINI_LIVE_ENABLED: "false"
      NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: "0"
      SENTRY_TRACES_SAMPLE_RATE: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.20.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm env:check
      - run: pnpm release:contract
      - run: pnpm tokens:check
      - run: pnpm claims:check
      - run: pnpm registry:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm build-storybook
      - run: pnpm audit --audit-level high
