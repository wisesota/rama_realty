name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.20.0
          run_install: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - name: Select isolated pnpm store
        run: echo "RAMA_PNPM_STORE_DIR=$RUNNER_TEMP/rama-pnpm-store" >> "$GITHUB_ENV"
      - name: Fetch exact lockfile graph into an isolated store
        run: pnpm fetch --frozen-lockfile --store-dir "$RAMA_PNPM_STORE_DIR"
      - name: Verify fetched store before dependency lifecycle scripts
        run: pnpm --store-dir "$RAMA_PNPM_STORE_DIR" store status
      - name: Trust the already-verified frozen lockfile for the offline phase
        run: echo "PNPM_CONFIG_TRUST_LOCKFILE=true" >> "$GITHUB_ENV"
      - name: Install offline from the isolated store
        run: pnpm install --offline --frozen-lockfile --store-dir "$RAMA_PNPM_STORE_DIR"
      - name: Verify toolchain, registry, lockfile, package payloads, and store integrity
        run: pnpm environment:diagnose -- --registry-probe

  quality:
    needs: dependency-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RATE_LIMIT_SECRET: ci-rate-limit-secret-00000000000000000000000000000000
      BUYER_SESSION_SECRET: ci-buyer-session-secret-0000000000000000000000000000000
      NEXT_PUBLIC_SUPABASE_URL: https://ci-project.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
      RAMA_DEMO_MODE: "false"
      GEMINI_LIVE_ENABLED: "false"
      GEMINI_LIVE_SESSION_RESUMPTION_ENABLED: "false"
      GEMINI_LIVE_DAILY_SESSION_LIMIT: "500"
      RAMA_OPERATIONAL_TELEMETRY_ENABLED: "false"
      RAMA_RELEASE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: "0"
      SENTRY_TRACES_SAMPLE_RATE: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RAMA_RELEASE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.20.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - name: Select isolated pnpm store
        run: echo "RAMA_PNPM_STORE_DIR=$RUNNER_TEMP/rama-quality-pnpm-store" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile --store-dir "$RAMA_PNPM_STORE_DIR"
      - run: pnpm environment:diagnose
      - run: pnpm package-manager:check
      - run: pnpm env:check
      - run: pnpm release:contract
      - run: pnpm assets:check
      - run: pnpm telemetry:contract
      - run: pnpm tokens:check
      - run: pnpm claims:check
      - run: pnpm registry:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:clean
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm build-storybook
      - run: pnpm audit --audit-level high
      - name: Write exact-SHA CI build attestation
        run: pnpm release:attest-ci -- --output artifacts/ci-build-attestation.json
      - name: Upload CI build attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-build-attestation-${{ env.RAMA_RELEASE_COMMIT }}
          path: artifacts/ci-build-attestation.json
          if-no-files-found: error
          retention-days: 90
