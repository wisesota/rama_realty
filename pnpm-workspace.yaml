overrides:
  '@storybook/addon-actions>uuid': 11.1.1

allowBuilds:
  # Reviewed native/build toolchain dependencies required by Sentry, Tailwind,
  # Storybook/Vite, Next image optimization, and module resolution.
  '@sentry/cli': true
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  # Its install hook is not required for application functionality.
  core-js-pure: false
  # The package's install hook is a no-op and is not needed at runtime.
  '@google/genai': false
  core-js: false
  protobufjs: false
  # Required by Impeccable's rendered URL audits; downloads its managed browser.
  puppeteer: true
  '@swc/core': true
  cbor-extract: true

patchedDependencies:
  "next@16.3.1": "patches/next@16.3.1.patch"
